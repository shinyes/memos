# Fork-only workflow: build the memos Docker image from this fork, publish it to
# GitHub Container Registry, and attach the image tarballs to a GitHub Release so
# the host can `docker load` them without pulling from a registry.
#
# Why a separate file instead of upstream's build-canary-image.yml:
#   * that workflow only runs on pushes to `main`, and this fork keeps `main` as
#     a pure mirror of upstream, so it would build the wrong tree;
#   * it logs in to Docker Hub and pushes to the `neosmemo/memos` and
#     `ghcr.io/usememos/memos` namespaces, which a fork has no rights to and no
#     secrets for.
#
# This file is fork-owned: upstream has no file with this name, so it never
# conflicts when rebasing onto a newer upstream.
name: Fork Image

on:
  # Pushing the change branch is what starts a build. Documentation-only pushes
  # are ignored so editing Readme2 does not publish a new image.
  push:
    branches: [feat/object-storage-image-derivatives]
    paths-ignore:
      - "**.md"
  # A dispatch entry only appears in the Actions UI once this file exists on the
  # default branch, which this fork deliberately keeps as an upstream mirror.
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms (comma separated)"
        required: false
        default: "linux/amd64,linux/arm64"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Resolved once so the image tags and the release tag can never disagree.
  #
  # The release tag is `<upstream release tag>-c.<build date>.<run number>`,
  # for example `v0.31.0-c.26.10.04.5`: it names the upstream version this fork is
  # based on, the UTC day the image was built, and the run that produced it.
  #   * the date says when the image was built, which a run number does not;
  #   * the run number keeps a second build on the same day from colliding.
  #
  # Tags are created through the API by `gh release`, never pushed with git, and
  # only a git push raises a `push` event. That matters once upstream's calendar
  # versions make this tag start with two digits (`26.10-c.…`), because
  # `[1-9][0-9].*` is the pattern that starts upstream's release workflow. Keep it
  # that way: never `git push` a tag, and never `git push --tags` — the latter
  # would push upstream's own calendar tags too.
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      fork_tag: ${{ steps.resolve.outputs.fork_tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve the build version and the release tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(bash scripts/release_version.sh development-version)"
          upstream="$(gh api repos/usememos/memos/releases/latest --jq .tag_name 2>/dev/null || true)"
          upstream="${upstream:-v0.0.0}"
          # Build date in UTC, the clock the repository's own development version
          # is derived from.
          build_date="$(date -u +%y.%m.%d)"
          fork_tag="${upstream}-c.${build_date}.${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "fork_tag=$fork_tag" >> "$GITHUB_OUTPUT"
          echo "development version: $version"
          echo "release tag:         $fork_tag"

  # server/frontend/dist is baked into the binary by go:embed, and
  # scripts/Dockerfile expects it to exist in the build context, so the SPA is
  # built first and handed to the image job.
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 11.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: "web/pnpm-lock.yaml"
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Run frontend build
        run: pnpm release
        working-directory: web

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: server/frontend/dist
          retention-days: 1

  build-push:
    needs: [meta, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pushing to ghcr.io/<this repository> with the built-in token.
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Download frontend artifacts
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: server/frontend/dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # One buildx invocation publishes every requested platform as a manifest
      # list, so no digest merge job is needed. scripts/Dockerfile builds from
      # --platform=$BUILDPLATFORM and cross-compiles with GOARCH=$TARGETARCH, so
      # the arm64 binary is a native amd64 compile: QEMU only covers the few RUN
      # steps in the target image, not the Go build.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.run_number }}
            ghcr.io/${{ github.repository }}:${{ needs.meta.outputs.fork_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true

  # A manifest list cannot be saved as a single tarball, so each platform is
  # pulled and saved on its own. Pulling does not need QEMU: the runner only has
  # to store the foreign-architecture image, never run it.
  #
  # The tarball carries the release tag in its name, so several builds can sit in
  # one download folder without being told apart by hand.
  save-images:
    needs: [meta, build-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull the image for this platform
        env:
          FORK_TAG: ${{ needs.meta.outputs.fork_tag }}
        run: docker pull --platform "${{ matrix.platform }}" "ghcr.io/${{ github.repository }}:${FORK_TAG}"

      - name: Save the image as a loadable tarball
        env:
          FORK_TAG: ${{ needs.meta.outputs.fork_tag }}
        run: |
          name="memos-${FORK_TAG}-${{ matrix.arch }}.tar.gz"
          # Saved by its release tag, so the tarball carries exactly the one tag the
          # host should end up with after `docker load`.
          docker save "ghcr.io/${{ github.repository }}:${FORK_TAG}" | gzip -1 > "$name"
          ls -lh "$name"

      - name: Upload the tarball
        uses: actions/upload-artifact@v6
        with:
          name: image-${{ matrix.arch }}
          path: memos-*.tar.gz
          retention-days: 7

  release:
    needs: [meta, save-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release create runs git, so the job needs a checkout even though it
      # only uploads files it downloaded.
      - uses: actions/checkout@v6

      - name: Download the image tarballs
        uses: actions/download-artifact@v7
        with:
          pattern: image-*
          merge-multiple: true

      - name: Write checksums
        run: sha256sum memos-*.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Write release notes
        run: |
          cat > NOTES.md <<'EOF'
          Fork build of the memos image, produced by the `Fork Image` workflow.

          - Fork release tag: `${{ needs.meta.outputs.fork_tag }}`
          - Commit: `${{ github.sha }}`
          - Workflow run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - Platforms: linux/amd64, linux/arm64

          ## Pull from GitHub Container Registry

          ```bash
          docker pull ghcr.io/${{ github.repository }}:${{ needs.meta.outputs.fork_tag }}   # this build
          docker pull ghcr.io/${{ github.repository }}:${{ github.run_number }}   # the same build, short alias
          ```

          ## Or load an attached image

          ```bash
          sha256sum -c SHA256SUMS.txt
          gunzip -c memos-${{ needs.meta.outputs.fork_tag }}-amd64.tar.gz | docker load   # or -arm64
          ```

          ## 适用范围：腾讯云对象存储 COS

          本构建的图片处理表达式面向**腾讯云 COS（数据万象）**：

          - 附件必须存放在 COS 桶中。其它 S3 兼容存储不认识 `imageMogr2` 语法，会原样返回对象，memos 会安全回退到原图（HEIC 在浏览器里显示不出来）。
          - 输出 AVIF 需要在数据万象中开通**图片高级压缩**。未开通时 COS 会对 `format/avif` 静默返回 JPEG，本构建会拒绝该答案并回退原图，而不是把 JPEG 当成 AVIF 发出去。
          - 缩略图使用 JPEG（与本地编码器共用一个缓存文件），页面大图使用 AVIF。实测 600px：AVIF 57 KB / WebP 81 KB / JPEG 104 KB。

          The image keeps the upstream layout: port 5230, non-root user, and a
          single binary with the SPA embedded. It carries this fork's changes and
          touches neither the database nor object storage, so it can take over an
          existing data directory.
          EOF
          cat NOTES.md

      # --target pins the tag to the commit that was built; without it gh would
      # tag the default branch, which on this fork is the upstream mirror.
      #
      # Re-running a workflow run keeps its run number, so on a retry the tag
      # already exists: refresh the assets instead of failing.
      - name: Create or refresh the release with the image assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.fork_tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; refreshing its assets"
            gh release upload "$TAG" memos-*.tar.gz SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file NOTES.md \
              --target "${{ github.sha }}" \
              memos-*.tar.gz SHA256SUMS.txt
          fi

      # Assets are ~53 MB per build and every build publishes one, so the list is
      # trimmed to the newest KEEP. Older images stay pullable from GHCR by their
      # own tag; only the downloadable tarballs age out. Raise KEEP to retain
      # more, or set it to 0 to keep everything.
      #
      # The release just published is excluded explicitly, and the candidates are
      # printed before anything is deleted, so a log always shows what this step
      # decided to do.
      - name: Trim old fork releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.fork_tag }}
          KEEP: "10"
        run: |
          [ "$KEEP" -gt 0 ] || exit 0
          old="$(
            gh release list --limit 100 --json tagName,createdAt \
              --jq "map(select(.tagName != \"${TAG}\")) | sort_by(.createdAt) | reverse | .[${KEEP}:] | .[].tagName"
          )"
          if [ -z "$old" ]; then
            echo "release list is within KEEP=${KEEP}; nothing to delete"
            exit 0
          fi
          echo "releases beyond the newest ${KEEP}, about to be deleted:"
          echo "$old"
          while read -r tag; do
            [ -n "$tag" ] || continue
            gh release delete "$tag" --yes --cleanup-tag
          done <<< "$old"
