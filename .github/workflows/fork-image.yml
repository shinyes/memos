# Fork-only workflow: build the memos Docker image from this fork, publish it to
# GitHub Container Registry, and attach the image tarballs to a GitHub Release so
# the host can `docker load` them without pulling from a registry.
#
# Why a separate file instead of upstream's build-canary-image.yml:
#   * that workflow only runs on pushes to `main`, and this fork keeps `main` as
#     a pure mirror of upstream, so it would build the wrong tree;
#   * it logs in to Docker Hub and pushes to the `neosmemo/memos` and
#     `ghcr.io/usememos/memos` namespaces, which a fork has no rights to and no
#     secrets for.
#
# This file is fork-owned: upstream has no file with this name, so it never
# conflicts when rebasing onto a newer upstream.
name: Fork Image

on:
  # Pushing the change branch is what starts a build. Documentation-only pushes
  # are ignored so editing Readme2 does not publish a new image.
  push:
    branches: [feat/object-storage-image-derivatives]
    paths-ignore:
      - "**.md"
  # A dispatch entry only appears in the Actions UI once this file exists on the
  # default branch, which this fork deliberately keeps as an upstream mirror.
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms (comma separated)"
        required: false
        default: "linux/amd64,linux/arm64"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # server/frontend/dist is baked into the binary by go:embed, and
  # scripts/Dockerfile expects it to exist in the build context, so the SPA is
  # built first and handed to the image job.
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 11.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: "web/pnpm-lock.yaml"
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Run frontend build
        run: pnpm release
        working-directory: web

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: server/frontend/dist
          retention-days: 1

  build-push:
    needs: build-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pushing to ghcr.io/<this repository> with the built-in token.
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version from commit date
        id: version
        run: echo "version=$(bash scripts/release_version.sh development-version)" >> "$GITHUB_OUTPUT"

      - name: Download frontend artifacts
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: server/frontend/dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # One buildx invocation publishes every requested platform as a manifest
      # list, so no digest merge job is needed. scripts/Dockerfile builds from
      # --platform=$BUILDPLATFORM and cross-compiles with GOARCH=$TARGETARCH, so
      # the arm64 binary is a native amd64 compile: QEMU only covers the few RUN
      # steps in the target image, not the Go build.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:fork
            ghcr.io/${{ github.repository }}:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true

  # A manifest list cannot be saved as a single tarball, so each platform is
  # pulled and saved on its own. Pulling does not need QEMU: the runner only has
  # to store the foreign-architecture image, never run it.
  save-images:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull the image for this platform
        run: docker pull --platform "${{ matrix.platform }}" "ghcr.io/${{ github.repository }}:fork"

      - name: Save the image as a loadable tarball
        run: |
          docker save "ghcr.io/${{ github.repository }}:fork" | gzip -1 > "memos-fork-${{ matrix.arch }}.tar.gz"
          ls -lh "memos-fork-${{ matrix.arch }}.tar.gz"

      - name: Upload the tarball
        uses: actions/upload-artifact@v6
        with:
          name: image-${{ matrix.arch }}
          path: memos-fork-${{ matrix.arch }}.tar.gz
          retention-days: 7

  release:
    needs: save-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the image tarballs
        uses: actions/download-artifact@v7
        with:
          pattern: image-*
          merge-multiple: true

      - name: Write checksums
        run: sha256sum memos-fork-*.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Write release notes
        run: |
          cat > NOTES.md <<'EOF'
          Fork build of the memos image, produced by the `Fork Image` workflow.

          - Commit: `${{ github.sha }}`
          - Workflow run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - Platforms: linux/amd64, linux/arm64

          ## Pull from GitHub Container Registry

          ```bash
          docker pull ghcr.io/${{ github.repository }}:fork              # latest build
          docker pull ghcr.io/${{ github.repository }}:${{ github.run_number }}   # this build
          ```

          ## Or load an attached image

          ```bash
          sha256sum -c SHA256SUMS.txt
          gunzip -c memos-fork-amd64.tar.gz | docker load    # or memos-fork-arm64.tar.gz
          ```

          The image keeps the upstream layout: port 5230, non-root user, and a
          single binary with the SPA embedded. It carries this fork's changes and
          touches neither the database nor object storage, so it can take over an
          existing data directory.
          EOF
          cat NOTES.md

      # --target pins the tag to the commit that was built; without it gh would
      # tag the default branch, which on this fork is the upstream mirror.
      # The tag is deliberately not CalVer: a `[1-9][0-9].*` tag would start
      # upstream's release workflow on this fork.
      - name: Create the release with the image assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "fork-${{ github.run_number }}" \
            --title "Fork image ${{ github.run_number }}" \
            --notes-file NOTES.md \
            --target "${{ github.sha }}" \
            memos-fork-amd64.tar.gz memos-fork-arm64.tar.gz SHA256SUMS.txt
